[project]
name = "evidence-lab"
version = "0.1.0"
description = "Ett lärprojekt för dokumenthämtning och utvärdering av RAG-system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<1.0",
    "uvicorn>=0.51,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
