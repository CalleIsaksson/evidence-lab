[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-lab"
version = "1.0.1"
description = "Classical document retrieval with reproducible evaluation baselines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<1.0",
    "scikit-learn>=1.9,<2.0",
    "uvicorn>=0.51,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
